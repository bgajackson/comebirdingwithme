# Decap CMS configuration for Come Birding With Me
#
# LOCAL TESTING (works right now, no accounts needed):
#   Run these two commands in separate terminals:
#     npx decap-server
#     npx @11ty/eleventy --serve
#   Then visit http://localhost:8080/admin/
#   local_backend below makes the CMS write directly to your files on disk.
#
# GOING LIVE (weekend 3, once deployed to Cloudflare Pages):
#   1. Update the `repo` line below to "your-github-username/comebirdingwithme"
#   2. Update `base_url` below to your real site URL
#   3. Follow the GitHub OAuth setup steps in README.md
#   Once both are in place, the same /admin/ page will use real GitHub login
#   instead of the local backend, whether visited locally or on the live site
#   (Decap automatically prefers the local backend only when running on
#   localhost, so this file doesn't need to change between the two).

local_backend: true

backend:
  name: github
  repo: your-github-username/comebirdingwithme # TODO: update before going live
  branch: main
  base_url: https://your-site.pages.dev # TODO: update before going live
  auth_endpoint: api/auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Species", name: "species", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Gallery"
    folder: "src/photos/entries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/photo.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Species", name: "species", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Notes", name: "body", widget: "markdown", required: false }
