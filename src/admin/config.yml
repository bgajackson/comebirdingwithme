# Decap CMS configuration for Come Birding With Me
#
# LOCAL TESTING (works right now, no accounts needed):
#   Run these two commands in separate terminals:
#     npx decap-server
#     npx @11ty/eleventy --serve
#   Then visit http://localhost:8080/admin/
#   local_backend below makes the CMS write directly to your files on disk.
#
# ON THE LIVE SITE:
#   The same /admin/ page uses real GitHub login instead (Decap
#   automatically prefers the local backend only when running on
#   localhost, so this file doesn't need to change between the two).

local_backend: true

backend:
  name: github
  repo: bgajackson/comebirdingwithme
  branch: main
  base_url: https://comebirdingwithme.reynolds-jack.workers.dev
  auth_endpoint: api/auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Species", name: "species", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Pin to homepage", name: "pinned", widget: "boolean", default: false, hint: "Pinned posts always show first on the homepage, regardless of date." }
      - { label: "Pin order", name: "pinOrder", widget: "number", required: false, hint: "Only matters if you pin more than one post — lower numbers show first among pinned posts." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Gallery"
    folder: "src/photos/entries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/photo.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Species", name: "species", widget: "string", required: false }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Notes", name: "body", widget: "markdown", required: false }
